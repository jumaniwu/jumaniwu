<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRICKX Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#020509;--bg1:#060D18;--bg2:#0A1628;
  --blue:#1A56DB;--blueL:#3B82F6;--accent:#0EA5E9;
  --green:#10B981;--gold:#F59E0B;--red:#EF4444;--purple:#8B5CF6;--teal:#14B8A6;
  --white:#fff;--off:#E2E8F0;--muted:#64748B;--dim:#374151;
  --border:rgba(26,86,219,0.15);--borderH:rgba(26,86,219,0.45);
  --f:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;
}
body{background:var(--bg0);color:var(--off);font-family:var(--f);min-height:100vh;display:flex;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:4px}
button,input,select{font-family:var(--f);outline:none;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fu{animation:fadeUp .3s ease both}
.blink{animation:blink 2s ease infinite}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg0);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.login-box{width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:28px;font-size:28px;font-weight:900;color:var(--white);font-family:'Georgia',serif;letter-spacing:2px}
.login-logo .x{color:var(--blueL)}
.login-tag{font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}

/* SIDEBAR */
.sidebar{width:200px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}}
.sb-logo{padding:16px;border-bottom:1px solid var(--border);font-size:16px;font-weight:900;color:var(--white);font-family:'Georgia',serif;letter-spacing:1px}
.sb-logo .x{color:var(--blueL)}
.sb-nav{flex:1;padding:8px;overflow-y:auto}
.sb-section{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 8px 5px;font-weight:700}
.sb-btn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;border:none;background:transparent;width:100%;text-align:left;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:2px;transition:all .2s}
.sb-btn:hover{background:rgba(26,86,219,.08);color:var(--off)}
.sb-btn.on{background:rgba(26,86,219,.15);color:var(--blueL);font-weight:700}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:100px;font-size:9px;font-weight:800;padding:1px 6px}
.sb-foot{padding:10px 8px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:4px}
.sb-av{width:28px;height:28px;border-radius:50%;background:rgba(26,86,219,.2);border:1px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--blueL)}

/* MAIN */
.main{margin-left:200px;flex:1;min-height:100vh;display:flex;flex-direction:column}
@media(max-width:768px){.main{margin-left:0}}
.topbar{background:rgba(6,13,24,.95);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px)}
#hamburger{display:none;background:none;border:none;color:var(--muted);font-size:20px}
@media(max-width:768px){#hamburger{display:block}}
.tb-badge{font-size:10px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:var(--green);padding:4px 10px;border-radius:100px;font-weight:700}
.content{flex:1;padding:20px 24px 40px}
@media(max-width:640px){.content{padding:14px 16px 40px}}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px}
.card.glow{border-color:var(--borderH);box-shadow:0 0 20px rgba(26,86,219,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:580px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* KPI */
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:13px 0 0 13px}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}
thead th{background:rgba(26,86,219,.08);padding:10px 14px;text-align:left;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--off)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(26,86,219,.04)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;font-weight:600;transition:all .2s;font-family:var(--f);padding:9px 18px;font-size:12px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:var(--blue);color:#fff}.bp:hover{background:var(--blueL)}
.bs{background:var(--green);color:#fff}.bs:hover{filter:brightness(1.1)}
.br{background:var(--red);color:#fff}.br:hover{filter:brightness(1.1)}
.bo{background:transparent;color:var(--blueL);border:1px solid rgba(59,130,246,.35)}.bo:hover{background:rgba(26,86,219,.08)}
.bg{background:rgba(26,86,219,.08);color:var(--blueL)}.bg:hover{background:rgba(26,86,219,.15)}
.bgold{background:var(--gold);color:#000;font-weight:700}.bgold:hover{filter:brightness(1.1)}
.bsm{padding:6px 12px;font-size:11px;border-radius:7px}
.bfull{width:100%}

/* INPUT */
.inp{background:var(--bg1);border:1px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--off);font-size:13px;width:100%;transition:border .2s}
.inp:focus{border-color:var(--blueL)}

/* BADGE */
.bdg{display:inline-flex;align-items:center;gap:3px;border-radius:100px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-green{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.bg-gold{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--gold)}
.bg-blue{background:rgba(26,86,219,.12);border:1px solid rgba(26,86,219,.3);color:var(--blueL)}
.bg-red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.bg-muted{background:rgba(100,116,139,.1);border:1px solid rgba(100,116,139,.2);color:var(--muted)}
.bg-teal{background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.3);color:var(--teal)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;transform:scale(.93);transition:transform .25s;padding:24px}
.modal-bg.open .modal-box{transform:scale(1)}

/* PB */
.pb{background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
.pf{border-radius:100px;transition:width 1s ease}

/* TABS */
.tabs{display:flex;gap:3px;background:var(--bg1);border-radius:10px;padding:3px;margin-bottom:18px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;color:var(--muted);background:transparent;white-space:nowrap;font-family:var(--f);transition:all .2s}
.tab.on{background:var(--blue);color:#fff}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;z-index:999;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:600;display:none;align-items:center;gap:8px;max-width:300px}
#toast.show{display:flex;animation:fadeUp .3s ease}

/* SROW */
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:12px;flex-wrap:wrap}
.srow:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">BRICK<span class="x">X</span><div class="login-tag">ADMIN PANEL</div></div>
    <div class="card glow" style="padding:24px">
      <div style="font-size:16px;font-weight:800;color:var(--white);margin-bottom:18px">Sign In</div>
      <div style="margin-bottom:12px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Admin Email</label>
        <input id="em" type="email" class="inp" placeholder="admin@brickxprotocol.io">
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Password</label>
        <input id="pw" type="password" class="inp" placeholder="••••••••">
      </div>
      <div id="lerr" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--red);display:none"></div>
      <button id="login-btn" class="btn bp bfull" onclick="doLogin()" style="padding:12px;font-size:14px">SIGN IN →</button>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">BRICK<span class="x">X</span> <span style="font-size:9px;color:var(--muted);letter-spacing:1.5px">ADMIN</span></div>
  <nav class="sb-nav">
    <div class="sb-section">Overview</div>
    <button class="sb-btn on" id="nav-dashboard" onclick="nav('dashboard')">◈ Dashboard</button>
    <button class="sb-btn" id="nav-analytics" onclick="nav('analytics')">📊 Analytics</button>
    <div class="sb-section">Users</div>
    <button class="sb-btn" id="nav-users" onclick="nav('users')">👥 All Users</button>
    <button class="sb-btn" id="nav-kyc" onclick="nav('kyc')">🪪 KYC Queue <span class="sb-badge" id="kyc-ct" style="display:none"></span></button>
    <button class="sb-btn" id="nav-wallets" onclick="nav('wallets')">🔑 Wallets</button>
    <div class="sb-section">ICO</div>
    <button class="sb-btn" id="nav-orders" onclick="nav('orders')">💳 Orders <span class="sb-badge" id="ord-ct" style="background:var(--gold);display:none"></span></button>
    <button class="sb-btn" id="nav-rounds" onclick="nav('rounds')">🚀 ICO Rounds</button>
    <button class="sb-btn" id="nav-distribute" onclick="nav('distribute')">✈️ Distribute BRX</button>
    <div class="sb-section">Properties</div>
    <button class="sb-btn" id="nav-properties" onclick="nav('properties')">🏠 Properties</button>
    <button class="sb-btn" id="nav-yield" onclick="nav('yield')">💰 Annual Dividend</button>
    <div class="sb-section">System</div>
    <button class="sb-btn" id="nav-settings" onclick="nav('settings')">⚙️ Settings</button>
    <button class="sb-btn" id="nav-audit" onclick="nav('audit')">📋 Audit Log</button>
  </nav>
  <div class="sb-foot">
    <div class="sb-user"><div class="sb-av" id="sb-av">A</div><div><div style="font-size:12px;font-weight:700;color:var(--white)" id="sb-name">Admin</div><div style="font-size:9px;color:var(--muted)" id="sb-email"></div></div></div>
    <button class="sb-btn" onclick="doLogout()" style="color:var(--red)">🚪 Logout</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button id="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div style="font-size:15px;font-weight:700;color:var(--white)" id="ptitle">Dashboard</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="tb-badge"><span class="blink" style="width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px"></span>System Live</div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted)" id="clk">--:-- UTC</div>
    </div>
  </div>
  <div class="content fu" id="pg"></div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="mbox"></div>
</div>

<script>
// ─── API CONFIG ───────────────────────────────────────────────
const API = window.BRICKX_API_URL || 'https://api.brickxprotocol.io';
var TOKEN_KEY = 'brickx_admin_token';
var ADMIN_KEY = 'brickx_admin_user';

var PAGE = 'dashboard';
var UFILT = 'all';
var OFILT = 'all';
var OPAGE = 1;
var OLIMIT = 20;
var USERS_CACHE = [];
var SET_KEYS = [];

// ─── API WRAPPER ──────────────────────────────────────────────
function getToken() { return sessionStorage.getItem(TOKEN_KEY) || ''; }
function clearAuth() { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(ADMIN_KEY); }

function api(path, opts) {
  opts = opts || {};
  var headers = {};
  if (opts.headers) Object.keys(opts.headers).forEach(function(k) { headers[k] = opts.headers[k]; });
  var token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var body = opts.body;
  if (body && typeof body !== 'string') body = JSON.stringify(body);
  if (body) headers['Content-Type'] = 'application/json';
  return fetch(API + path, { method: opts.method || 'GET', headers: headers, body: body })
    .then(function(res) {
      if (res.status === 401) {
        clearAuth();
        showLogin();
        throw new Error('Session expired. Please sign in again.');
      }
      return res.json().catch(function() { return {}; }).then(function(data) {
        if (!res.ok) throw new Error(data.error || data.message || ('Request failed (HTTP ' + res.status + ')'));
        return data;
      });
    })
    .catch(function(e) {
      if (e instanceof TypeError) throw new Error('Network error — could not reach the BRICKX API.');
      throw e;
    });
}

// ─── AUTH ─────────────────────────────────────────────────────
function doLogin() {
  var e = document.getElementById('em').value.trim();
  var p = document.getElementById('pw').value;
  var err = document.getElementById('lerr');
  var btnEl = document.getElementById('login-btn');
  err.style.display = 'none';
  if (!e || !p) { err.textContent = 'Enter email and password.'; err.style.display = 'block'; return; }
  btnEl.disabled = true; btnEl.textContent = 'SIGNING IN…';
  api('/api/auth/login', { method: 'POST', body: { email: e, password: p } })
    .then(function(res) {
      if (!res.token || !res.user) throw new Error('Unexpected response from server.');
      if (!res.user.is_admin) throw new Error('Not an admin account');
      sessionStorage.setItem(TOKEN_KEY, res.token);
      sessionStorage.setItem(ADMIN_KEY, JSON.stringify({
        first_name: res.user.first_name || 'Admin',
        email: res.user.email || e
      }));
      document.getElementById('pw').value = '';
      enterApp();
      toast('Welcome to BRICKX Admin!', 'success');
    })
    .catch(function(ex) {
      err.textContent = ex.message || 'Login failed.';
      err.style.display = 'block';
    })
    .then(function() { btnEl.disabled = false; btnEl.textContent = 'SIGN IN →'; });
}
function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  var u = {};
  try { u = JSON.parse(sessionStorage.getItem(ADMIN_KEY) || '{}'); } catch (e2) {}
  document.getElementById('sb-name').textContent = u.first_name || 'Admin';
  document.getElementById('sb-email').textContent = u.email || '';
  document.getElementById('sb-av').textContent = (u.first_name || 'A').charAt(0).toUpperCase();
  startClock();
  nav('dashboard');
  refreshCounts();
}
function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('sidebar').classList.remove('open');
}
function doLogout() {
  clearAuth();
  showLogin();
}
document.getElementById('pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

// ─── NAV ──────────────────────────────────────────────────────
var TITLES = {dashboard:'Dashboard',analytics:'Analytics',users:'User Management',kyc:'KYC Queue',wallets:'Wallet Registry',orders:'ICO Orders',rounds:'ICO Rounds',distribute:'Distribute BRX',properties:'Properties',yield:'Annual Dividend',settings:'System Settings',audit:'Audit Log'};
function nav(p) {
  PAGE = p;
  document.querySelectorAll('.sb-btn').forEach(function(b) { b.classList.remove('on'); });
  var nb = document.getElementById('nav-' + p);
  if (nb) nb.classList.add('on');
  document.getElementById('ptitle').textContent = TITLES[p] || p;
  var pgEl = document.getElementById('pg');
  pgEl.innerHTML = '';
  pgEl.className = 'content fu';
  var fn = {dashboard:pgDash,analytics:pgAnalytics,users:pgUsers,kyc:pgKYC,wallets:pgWallets,orders:pgOrders,rounds:pgRounds,distribute:pgDistribute,properties:pgProps,yield:pgYield,settings:pgSettings,audit:pgAudit}[p];
  if (fn) fn();
  if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
}
function refreshCounts() {
  api('/api/admin/dashboard').then(function(dx) {
    setBadge('kyc-ct', dx.kycPending);
    setBadge('ord-ct', dx.pendingOrders);
  }).catch(function() {});
}
function setBadge(id, n) {
  var e = document.getElementById(id);
  if (!e) return;
  if (n > 0) { e.textContent = n; e.style.display = ''; }
  else e.style.display = 'none';
}

// ─── HELPERS ──────────────────────────────────────────────────
function mk(tag, props) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function(k) {
    if (k === 'cls') e.className = props[k];
    else if (k === 'css') e.style.cssText = props[k];
    else if (k === 'html') e.innerHTML = props[k];
    else if (k === 'txt') e.textContent = props[k];
    else if (k === 'on') e.onclick = props[k];
    else e.setAttribute(k, props[k]);
  });
  return e;
}
function ap(parent) {
  var args = Array.prototype.slice.call(arguments, 1);
  args.forEach(function(c) { if (c) parent.appendChild(c); });
  return parent;
}
function d(css, children) {
  var e = mk('div', {css: css});
  if (children) ap.apply(null, [e].concat(Array.isArray(children) ? children : [children]));
  return e;
}
function t(tag, css, text) { return mk(tag, {css: css, txt: text}); }
function s(css, text) { return mk('span', {css: css, txt: text}); }

function bdg(text, cls) { return mk('span', {cls: 'bdg ' + (cls||'bg-muted'), txt: text}); }
function sbdg(status) {
  var m = {
    approved:['✓ Approved','bg-green'],pending:['⏳ Pending','bg-gold'],
    not_started:['○ Unverified','bg-muted'],rejected:['✗ Rejected','bg-red'],
    confirmed:['✓ Confirmed','bg-green'],pending_payment:['⏳ Pending Pay','bg-gold'],
    distributed:['✈ Distributed','bg-teal'],live:['Live','bg-green'],Live:['Live','bg-green'],
    funding:['Funding','bg-gold'],ico_funding:['ICO Funding','bg-gold'],
    'ICO Funding':['ICO Funding','bg-gold'],'Coming Soon':['Coming Soon','bg-blue']
  };
  var info = m[status] || [status || '—', 'bg-muted'];
  return bdg(info[0], info[1]);
}

function pb(pct, color, h) {
  var wrap = mk('div', {cls:'pb', css:'height:'+( h||8)+'px'});
  var fill = mk('div', {cls:'pf', css:'width:'+Math.min(pct||0,100).toFixed(1)+'%;height:'+(h||8)+'px;background:'+(color||'linear-gradient(90deg,var(--blue),var(--accent))')});
  wrap.appendChild(fill);
  return wrap;
}

function kpi(lbl, val, sub, color) {
  var c = mk('div', {cls:'kpi'});
  c.style.setProperty('border-left', '3px solid ' + color);
  ap(c, t('div','font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px', lbl),
        t('div','font-size:24px;font-weight:800;color:var(--white);font-family:var(--mono);line-height:1', val),
        t('div','font-size:11px;color:var(--muted);margin-top:4px', sub));
  return c;
}

function btn(text, cls, fn) { return mk('button', {cls:'btn bsm '+cls, txt:text, on:fn}); }

function secHdr(title, sub, btnTxt, btnFn) {
  var row = d('display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px');
  var left = d('');
  ap(left, t('h2','font-size:17px;font-weight:800;color:var(--white)',title));
  if (sub) ap(left, t('p','font-size:12px;color:var(--muted);margin-top:2px',sub));
  ap(row, left);
  if (btnTxt && btnFn) ap(row, btn(btnTxt, 'bp', btnFn));
  return row;
}

function mkTable(headers, rows) {
  var wrap = mk('div', {cls:'tbl-wrap'});
  var tbl = mk('table');
  var thead = mk('thead');
  var hrow = mk('tr');
  headers.forEach(function(h) { ap(hrow, mk('th', {txt:h})); });
  ap(thead, hrow);
  ap(tbl, thead);
  var tbody = mk('tbody');
  rows.forEach(function(row) {
    var tr = mk('tr');
    row.forEach(function(cell) {
      var td = mk('td');
      if (typeof cell === 'string' || typeof cell === 'number') td.textContent = cell;
      else if (cell && cell.nodeType) td.appendChild(cell);
      ap(tr, td);
    });
    ap(tbody, tr);
  });
  ap(tbl, tbody);
  ap(wrap, tbl);
  return wrap;
}

function miniGrid(items) {

  items.forEach(function(item) {

// Formatters — USD only.
function usd(n) { if (n == null || isNaN(Number(n))) return '—'; return '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits: 2}); }
function num(n) { if (n == null || isNaN(Number(n))) return '—'; return Number(n).toLocaleString('en-US'); }
function kfmt(n) {
  if (n == null || isNaN(Number(n))) return '—';
  n = Number(n);
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toLocaleString('en-US');
}
function dt(v) { return v ? String(v).slice(0, 10) : '—'; }
function orderUserName(o) {
  if (!o.users) return '—';
  return (((o.users.first_name || '') + ' ' + (o.users.last_name || '')).trim()) || (o.users.email || '—');
}

function saveSaleControl() {

    active_round:       document.getElementById('rc-active').value,
    min_investment_usd: document.getElementById('rc-min').value,

  api('/api/admin/settings', { method: 'PATCH', body: body })
    .then(function() { toast('✅ Sale control saved.', 'success'); nav('rounds'); })

function saveRound(r) {
  var body = {};
  var pv = document.getElementById('rp-' + r.key).value;
  if (!pv || parseFloat(pv) <= 0) { toast('Price must be a positive number.','warn'); return; }
  body[r.pField] = pv;
  if (r.cField) {
    var cv = document.getElementById('rcap-' + r.key).value;
    if (!cv || parseFloat(cv) <= 0) { toast('Hard cap must be a positive number.','warn'); return; }
    body[r.cField] = cv;
  }
  api('/api/admin/settings', { method: 'PATCH', body: body })
    .then(function() { toast('✅ ' + r.name + ' saved.', 'success'); nav('rounds'); })
    .catch(function(e) { toast('Save failed: ' + e.message, 'error'); });

    ap(info, t('div','font-size:11px;color:var(--muted)', e2.desc || e2.key));
    var ctrl = d('display:flex;align-items:center;gap:8px;flex-shrink:0');
    var inp = mk('input',{cls:'inp',id:'s-i'+i,css:'min-width:200px;max-width:260px'});
    inp.value = e2.value;
    var sbBtn = mk('button',{cls:'btn bs bsm',txt:'Save',on:(function(idx){return function(){saveSetting(idx);};})(i)});
    ap(ctrl, inp, sbBtn);
    ap(row, info, ctrl);
    ap(c, row);
  });
  add(c);
}
function saveSetting(idx) {
  var key = SET_KEYS[idx];
  var inp = document.getElementById('s-i' + idx);
  if (!key || !inp) return;
  var body = {};
  body[key] = inp.value;
  api('/api/admin/settings', { method: 'PATCH', body: body })
    .then(function() { toast('✅ Setting saved: ' + key, 'success'); })
    .catch(function(e) { toast('Save failed: ' + e.message, 'error'); });
}

function pgAudit() {
  add(loadingCard('Loading audit log…'));
  api('/api/admin/audit')
    .then(function(r) { if (PAGE !== 'audit') return; clearPg(); renderAudit((r && r.logs) || []); })
    .catch(function(e) { if (PAGE !== 'audit') return; clearPg(); add(errCard(e.message, pgAudit)); });
}
function renderAudit(logs) {
  add(secHdr('Audit Log','All admin actions logged'));
  if (!logs.length) { add(mk('div',{cls:'card',css:'text-align:center;padding:30px;color:var(--muted)',txt:'No audit entries yet.'})); return; }
  var cm = {kyc_approved:'bg-green',kyc_rejected:'bg-red',setting_updated:'bg-gold',payment_confirmed:'bg-blue',order_confirmed:'bg-blue',brx_distributed:'bg-teal',dividend_distributed:'bg-teal'};
  var rows = logs.map(function(l) {
    var admin = l.users ? (l.users.email || l.users.first_name || '—') : '—';
    var target = [l.target_type, l.target_id].filter(Boolean).join(' ');
    var details = l.details;
    if (details != null && typeof details === 'object') details = JSON.stringify(details);
    return [
      s('font-size:10px;color:var(--muted)', (l.created_at || '').replace('T',' ').slice(0,16)),
      s('font-size:11px;color:var(--muted)', admin),
      bdg(String(l.action || '—').replace(/_/g,' ').toUpperCase(), cm[l.action] || 'bg-muted'),
      s('font-weight:600;color:var(--white)', target || '—'),
      s('font-size:11px;color:var(--muted)', details || '—')
    ];
  });
  add(mkTable(['Time','Admin','Action','Target','Detail'], rows));
}

// ─── ACTIONS ──────────────────────────────────────────────────
function setKYC(userId, status) {
  var body = { status: status };
  if (status === 'rejected') {
    var reason = prompt('Rejection reason (shown to the user):','');
    if (reason === null) return;
    if (!reason.trim()) { toast('A rejection reason is required.','warn'); return; }
    body.reason = reason.trim();
  } else {
    if (!confirm('Approve KYC for this user?')) return;
  }
  api('/api/admin/kyc/' + encodeURIComponent(userId), { method: 'PATCH', body: body })
    .then(function() {
      toast(status === 'approved' ? '✅ KYC approved.' : 'KYC rejected.', status === 'approved' ? 'success' : 'warn');
      closeModal();
      refreshCounts();
      nav(PAGE);
    })
    .catch(function(e) { toast('KYC update failed: ' + e.message, 'error'); });
}
function confirmOrder(orderId) {
  var tx = prompt('Enter the on-chain transaction hash (0x + 64 hex characters):','');
  if (tx === null) return;
  tx = tx.trim();
  if (!/^0x[0-9a-fA-F]{64}$/.test(tx)) {
    toast('Invalid tx hash — must be 0x followed by 64 hex characters.','error');
    return;
  }
  api('/api/admin/orders/' + encodeURIComponent(orderId) + '/confirm', { method: 'PATCH', body: { txHash: tx } })
    .then(function() {
      toast('✅ Order ' + orderId + ' confirmed.','success');
      refreshCounts();
      nav(PAGE);
    })
    .catch(function(e) { toast('Confirm failed: ' + e.message, 'error'); });
}
function cancelOrder(orderId) {
  var reason = prompt('Cancel order ' + orderId + '? This frees the reserved allocation.\n\nReason (optional):', 'Unpaid / abandoned');
  if (reason === null) return;
  api('/api/admin/orders/' + encodeURIComponent(orderId) + '/cancel', { method: 'PATCH', body: { reason: reason } })
    .then(function() {
      toast('Order ' + orderId + ' cancelled.','success');
      refreshCounts();
      nav(PAGE);
    })
    .catch(function(e) { toast('Cancel failed: ' + e.message, 'error'); });
}
function refundOrder(orderId) {
  if (!confirm('Mark order ' + orderId + ' as REFUNDED?\n\nThis is bookkeeping only — send the crypto back from the treasury Safe manually first.')) return;
  var refundTx = prompt('Refund transaction hash (0x + 64 hex, optional):', '');
  if (refundTx === null) return;
  refundTx = refundTx.trim();
  if (refundTx && !/^0x[0-9a-fA-F]{64}$/.test(refundTx)) { toast('Invalid tx hash.','error'); return; }
  var reason = prompt('Reason (shown to the user):', 'Refund requested');
  if (reason === null) return;
  api('/api/admin/orders/' + encodeURIComponent(orderId) + '/refund', { method: 'PATCH', body: { refundTx: refundTx, reason: reason.trim() } })
    .then(function() { toast('Order ' + orderId + ' marked refunded.','success'); refreshCounts(); nav(PAGE); })
    .catch(function(e) { toast('Refund failed: ' + e.message, 'error'); });
}
function distributeBatch(orderIds) {
  if (!orderIds || !orderIds.length) { toast('No orders selected.','warn'); return; }
  if (!confirm('Distribute BRX for ' + orderIds.length + ' order(s)? This is recorded on-chain and cannot be undone.')) return;
  api('/api/admin/distribute/batch', { method: 'POST', body: { orderIds: orderIds } })
    .then(function(r) {
      toast('✈️ Distribution executed for ' + orderIds.length + ' order(s).','success');
      refreshCounts();
      nav(PAGE);
    })
    .catch(function(e) { toast('Distribution failed: ' + e.message, 'error'); });
}
function viewUser(id) {
  var u = USERS_CACHE.find(function(x){return x.id===id;});
  if (!u) { toast('User not loaded.','warn'); return; }
  var name = ((u.first_name||'') + ' ' + (u.last_name||'')).trim() || u.email || '—';
  var mb = document.getElementById('mbox');
  mb.innerHTML = '';
  var hdr = d('display:flex;justify-content:space-between;align-items:center;margin-bottom:16px');
  ap(hdr, t('div','font-size:16px;font-weight:800;color:var(--white)', name));
  ap(hdr, mk('button',{css:'background:rgba(255,255,255,.08);border:none;color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer',txt:'✕',on:closeModal}));
  ap(mb, hdr);
  [['Email',u.email||'—'],['Country',u.country||'—'],['KYC',u.kyc_status||'—'],['Wallet',u.wallet_address||'Not set'],['Referral Code',u.referral_code||'—'],['Joined',dt(u.created_at)],['Last Login',u.last_login?String(u.last_login).replace('T',' ').slice(0,16):'—']].forEach(function(item) {
    var row = d('display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px');
    ap(row, s('color:var(--muted)',item[0]), s('color:var(--white);font-weight:600;word-break:break-all',item[1]));
    ap(mb, row);
  });
  var br = d('display:flex;gap:9px;margin-top:14px;flex-wrap:wrap');
  if (u.kyc_status !== 'approved') {
    ap(br, mk('button',{cls:'btn bs',txt:'✅ Approve KYC',on:(function(uid){return function(){setKYC(uid,'approved');};})(u.id)}));
    ap(br, mk('button',{cls:'btn br',txt:'❌ Reject',on:(function(uid){return function(){setKYC(uid,'rejected');};})(u.id)}));
  }
  ap(br, mk('button',{cls:'btn bo',txt:'Close',on:closeModal}));
  ap(mb, br);
  openModal();
}
// CSV export — escapes quotes and neutralizes formula-injection (= + - @ prefixes).
function csvCell(v) {
  v = (v == null ? '' : String(v)).replace(/"/g, '""');
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return '"' + v + '"';
}
function exportWallets() {
  if (!USERS_CACHE.length) { toast('No user data loaded yet.','warn'); return; }
  var rows = ['User,Email,Country,Wallet,KYC'];
  USERS_CACHE.forEach(function(u) {
    rows.push([
      csvCell(((u.first_name||'') + ' ' + (u.last_name||'')).trim()),
      csvCell(u.email),
      csvCell(u.country),
      csvCell(u.wallet_address),
      csvCell(u.kyc_status)
    ].join(','));
  });
  var blob = new Blob([rows.join('\n')],{type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'brickx_wallets.csv'; a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ Exported ' + USERS_CACHE.length + ' rows.','success');
}
function exportUsersCSV() {
  if (!USERS_CACHE.length) { toast('No user data loaded yet.','warn'); return; }
  var rows = ['Name,Email,Country,Status,KYC,Referral,Wallet,Joined'];
  USERS_CACHE.forEach(function(u) {
    rows.push([
      csvCell(((u.first_name||'') + ' ' + (u.last_name||'')).trim()),
      csvCell(u.email),
      csvCell(u.country),
      csvCell(u.is_active === false ? 'whitelist' : 'registered'),
      csvCell(u.kyc_status),
      csvCell(u.referral_code),
      csvCell(u.wallet_address),
      csvCell(u.created_at)
    ].join(','));
  });
  var blob = new Blob([rows.join('\n')],{type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'brickx_users_whitelist.csv'; a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ Exported ' + USERS_CACHE.length + ' rows.','success');
}
function copyTxt(t2) { navigator.clipboard.writeText(t2).then(function(){toast('Copied!','success');}).catch(function(){}); }

// ─── MODAL ────────────────────────────────────────────────────
function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ─── TOAST ────────────────────────────────────────────────────
function toast(msg, type) {
  var t2 = document.getElementById('toast');
  var c = type==='success'?'rgba(16,185,129,.15)':type==='warn'?'rgba(245,158,11,.15)':'rgba(239,68,68,.15)';
  var bc = type==='success'?'rgba(16,185,129,.4)':type==='warn'?'rgba(245,158,11,.4)':'rgba(239,68,68,.4)';
  var tc = type==='success'?'var(--green)':type==='warn'?'var(--gold)':'var(--red)';
  t2.style.cssText = 'background:'+c+';border:1px solid '+bc+';color:'+tc;
  t2.textContent = msg;
  t2.classList.add('show');
  setTimeout(function(){ t2.classList.remove('show'); }, 4000);
}
function startClock() {
  function tick() { var e=document.getElementById('clk'); if(e) e.textContent=new Date().toUTCString().slice(17,25)+' UTC'; }
  tick(); setInterval(tick,1000);
}

// ─── INIT ─────────────────────────────────────────────────────
(function init() {
  if (getToken()) enterApp();
  else showLogin();
})();
</script>
